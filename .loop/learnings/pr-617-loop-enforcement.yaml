learning_candidate:
  id: pr-617-loop-enforcement
  created_from_task: "issue-541 / PR 617"
  trigger: "ユーザーが『振り返りをこのPRに含めて。適用しない振り返りは目的が分からない』と明示した"
  event_type: human_correction

  observed_problem: "Process Learning を Candidate 記録のまま現在PRへ適用せず、独立CR/SR省略と false completion が文書だけでは再発する"
  evidence:
    - "Delivery skill 読了後に CODE_REVIEW / SECURITY_REVIEW を自己判定でスキップした"
    - "PR URL を完了扱いにし、pending CI を session 終了理由にした"
    - "Learning を『このPRには混ぜない』と報告したところ、ユーザーが目的不明として差し戻した"

  root_cause:
    immediate_cause: "振り返りの既定が record_candidate_for_next_task で、適用しない記録を完了にできた"
    process_cause: "既存禁止は散文のみで、SHA固定のレビューEvidenceを Delivery 前に落とす機械Gateが無かった"
    why_existing_gate_or_skill_missed_it: "learning_gate は candidates_recorded で PASS でき、application.status=applied を要求しなかった"

  generalized_rule: "user-requested current-PR apply は観測可能な enforcement 差分が現在 Delivery PR に入るまで learning_gate を PASS にしない。Agent Delivery は HEAD SHA に固定した独立 CR/SR Evidence が無いと FAIL する"

  recurrence_risk: high
  impact: high
  deterministic: true

  duplicate_check:
    status: overlaps
    related_rules:
      - "AGENTS.md 自己判定禁止 / PR作成は完了ではない"
      - "skills/code-review と skills/security-review の SHA固定 Evidence"
    why_existing_rule_was_insufficient: "文書を破っても Delivery が止まらなかった"

  proposed_target: script_or_code
  target_reason: "reminder より enforcement。check-task-worktree と同型の純関数 + unit test"
  target_location: scripts/check-loop-evidence.mjs

  human_gate:
    required: true
    status: accepted
    decision_reason: "ユーザーがこのPRへの適用を明示した"

  application:
    status: applied
    location: scripts/check-loop-evidence.mjs
    change_reference: "PR 617 loop evidence checker"

  observation:
    status: observing
    task_samples:
      - "PR 617"
    recurrence_count: 0
    escalation_target: ci_or_gate
