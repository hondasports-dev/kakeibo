learning_candidate:
  id: pr-647-verification-efficiency
  created_from_task: "PR 647 / review follow-up"
  trigger: "ユーザーが同一セッション内のテスト再実行の多さを指摘し、loop改善を依頼した"
  event_type: manual_check_repetition

  observed_problem: "必要な失敗後retryや最新headのCI確認に加えて、ローカル全量test・lint・build・formatとCIの同種checkが重なり、検証の正本と再実行条件が曖昧だった"
  evidence:
    - "対象4 suiteの初回失敗はselector修正後に同じtargeted suiteを再実行しており、原因修正に伴う必要なretryだった"
    - "最終の小さな実装変更後は対象page testだけを再実行し、全量local testを惰性でやり直さなかった"
    - "ローカルの全量test・lint・build・formatと、push後のCI全量checkが同じDelivery changeで重なった"
    - "最新headのCIとE2EはPR Aftercareの必須Evidenceであり、ローカルtargeted checkでは代替できない"

  root_cause:
    immediate_cause: "verificationを実行する単位と、local / CIのcheck ownershipが明示されていなかった"
    process_cause: "minimal verificationとaffected scopeは定義されていたが、verification epoch・evidence identity・duplicate full checkの記録形式が無かった"
    why_existing_gate_or_skill_missed_it: "skills/verificationはlocalとCIの全量重複を避ける方針を含んでいた一方、docsにはsrc変更時のlocal E2Eに関する古い強い表現が残り、重複を機械的にFAILにするvalidatorも無かった"

  generalized_rule: "関連編集を一つのverification epochにまとめ、localは変更・直接影響範囲とbrowser ACに限定し、repository全量test/coverage・回帰E2E・必須static checkは最新headのCI Aftercareを正本にする。同じ全量checkを重ねる場合は理由と影響・feedback遅延の正当化をEvidenceへ記録し、失敗修正後は依存checkだけを再実行する"

  recurrence_risk: medium
  impact: medium
  deterministic: true

  duplicate_check:
    status: overlaps
    related_rules:
      - "skills/verification/SKILL.md の minimal / local-CI duplication policy"
      - ".loop/process.yaml の affected-scope verification profile"
      - "docs/development-process.md の CI / E2E ownership"
    why_existing_rule_was_insufficient: "実行単位・正本・retry理由を一つの証跡として要求しておらず、同じheadの全量重複を検出できなかった"

  proposed_target: script_or_code
  target_reason: "文章だけでなく、task evidenceの欠落・理由なしduplicate・理由なしrerunをdeterministicに検出する"
  target_location: "scripts/check-loop-evidence.mjs; .loop/process.yaml; .loop/templates/task-state.yaml"

  human_gate:
    required: false
    status: accepted
    decision_reason: "ユーザーがこのセッションの振り返りとloop改善を明示的に依頼した"

  application:
    status: applied
    location: "skills/verification/SKILL.md; .loop/process.yaml; .loop/templates/task-state.yaml; scripts/check-loop-evidence.mjs"
    change_reference: "verification epoch / authority / rerun policy and validator"

  observation:
    status: observing
    task_samples:
      - "PR 647 / review follow-up"
    recurrence_count: 0
    escalation_target: ci_or_gate
