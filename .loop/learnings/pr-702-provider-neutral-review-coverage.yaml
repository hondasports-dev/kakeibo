learning_candidate:
  id: pr-702-provider-neutral-review-coverage
  created_from_task: "Issue 672 / PR 702"
  trigger: "ユーザーが、レビューサービスの固有名詞に依存するとサービス切替時に指摘がすり抜けるため、検出とProcess Learningを抽象化するよう明示した"
  event_type: human_correction

  observed_problem: "レビュー指摘の対応とProcess Learningの記録が会話上で分離し、利用サービス名を置き換えた時にactionableな指摘の突合が抜ける余地があった"
  evidence:
    - "既存のProcess Learningはcandidateの形を検証したが、レビュー結果の全件がFinding Ledgerとcandidateへ到達したことを検証していなかった"
    - "レビューサービス名がprompt-injection guardと過去の学習記録に残り、サービス切替時の判定契約が不明確だった"
    - "ユーザーがサービス切替時のすり抜けリスクを明示し、現在PRへの改善反映を依頼した"

  root_cause:
    immediate_cause: "レビュー結果と学習候補を結ぶstable IDのprovider-neutral契約が無かった"
    process_cause: "PR Aftercareがレビュー結果の収集完了・current head一致・actionable findingのFinding Ledger / Process Learning紐付きを必須化していなかった"
    why_existing_gate_or_skill_missed_it: "既存checkerはlearning recordのshapeとdispositionだけを検証し、外部レビュー結果との逆引きcoverageを検証していなかった"

  generalized_rule: "レビュー結果はサービス名ではなく、current headへ束縛したcompleteなprovider-neutral snapshot（stable IDとactionable）として扱い、actionableな全IDをFinding LedgerとProcess Learning candidate.source_finding_idsへ紐付ける。再利用不能でもno_changeとrationale / evidenceを残す"

  recurrence_risk: high
  impact: high
  deterministic: true

  duplicate_check:
    status: overlaps
    related_rules:
      - "PR AftercareのFinding Ledger / revision consistency"
      - "Process LearningのResult persistence"
      - "既存check-loop-evidenceのlearning disposition検証"
    why_existing_rule_was_insufficient: "既存ruleはレビュー指摘を同じFinding Ledgerへ保持することを定めていたが、収集結果とのstable ID突合とactionable全件coverageを機械的に要求していなかった"

  proposed_target: script_or_code
  target_reason: "サービス名に依存しない入力契約とfail-closedなstable ID coverageをdeterministicに検出する"
  target_location: "scripts/check-loop-evidence.mjs; scripts/check-loop-evidence.test.mjs; .loop/templates/review-findings.json"

  human_gate:
    required: false
    status: accepted
    decision_reason: "ユーザーが現在PRへの抽象化反映を明示した"

  application:
    status: applied
    location: "scripts/check-loop-evidence.mjs; .loop/process.yaml; .loop/README.md; skills/process-learning/SKILL.md; skills/pr-aftercare/SKILL.md; docs/development-process.md"
    change_reference: "PR 702 provider-neutral review coverage"

  observation:
    status: observing
    task_samples:
      - "Issue 672 / PR 702"
    recurrence_count: 0
    escalation_target: ci_or_gate
