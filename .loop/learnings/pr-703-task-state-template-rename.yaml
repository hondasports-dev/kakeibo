learning_candidate:
  id: pr-703-task-state-template-rename
  created_from_task: "Issue #700 / PR #703"
  trigger: "自動レビューでstaged renameによるpath-based check回避の可能性が指摘された"
  event_type: actionable_review_finding

  observed_problem: "staged pathのrename検知が有効なままだと、tracked task-state templateの旧パスが一覧から消え、publish前checkerを回避できる可能性があった"
  evidence:
    - "初回checkerはgit diff --cached --name-only -zでstaged pathを収集していた"
    - "PR #703のレビューで、templateから別パスへのstaged rename時に旧パスを評価できないケースが示された"
    - "修正後は--no-renamesを付け、実Git repositoryで旧パスと新パスの両方を返す回帰テストが13件中1件としてPASSした"

  root_cause:
    immediate_cause: "path-based checkerの入力にGitのrename表示をそのまま使い、削除側パスの保持を明示していなかった"
    process_cause: "publish前のdeterministic checkを設計する際に、add・modifyだけでなくrename・deleteの差分表現をboundaryとしてCoverageへ含めていなかった"
    why_existing_gate_or_skill_missed_it: "初回のpure function testはtemplate変更とcurrent instance stagingを確認したが、Gitのstaged renameを実際に生成するintegration boundaryが無かった"

  generalized_rule: "path-based publish gateはrename detectionを無効化して旧・新パスを評価し、add・modify・rename・deleteを実Gitの回帰テストで確認する"
  recurrence_risk: medium
  impact: medium
  deterministic: true

  duplicate_check:
    status: new
    related_rules:
      - "Issue #700のtracked template / ignored current instance保存契約"
      - "skills/delivery/SKILL.mdのpublish前task-state checker"
    why_existing_rule_was_insufficient: "rename boundaryとpath collectionの失敗モードがloop contractと初回テストに明記されていなかった"

  proposed_target: script_or_code
  target_reason: "文章上の注意喚起ではなく、rename表示に依存しない入力収集と回帰テストで再発を防ぐ"
  target_location: "scripts/check-task-state-template.mjs; scripts/check-task-state-template.test.mjs"

  human_gate:
    required: false
    status: not_required
    decision_reason: "検証可能なpath collectionの修正で完結し、production・data・external writeを伴わない"

  application:
    status: applied
    location: "scripts/check-task-state-template.mjs; scripts/check-task-state-template.test.mjs"
    change_reference: "commit 9f411dc"

  observation:
    status: observing
    task_samples:
      - "PR #703"
    recurrence_count: 0
    escalation_target: ci_or_gate
