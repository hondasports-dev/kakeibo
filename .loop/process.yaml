version: 8
name: suzumemo-agent-loop
plugin_manifest: plugin.json
skills_root: skills
default_base_branch: preview
entrypoint: AGENTS.md
entry_state: workspace_preflight

principles:
  - evidence_before_progress
  - cheap_deterministic_gates_are_always_on
  - expensive_reasoning_gates_are_risk_or_event_driven
  - specification_confidence_is_separate_from_change_risk
  - c0_never_advances_to_implementation
  - risk_is_based_on_impact_not_line_count
  - risk_may_escalate_immediately
  - risk_downgrade_requires_preimplementation_evidence
  - max_observed_risk_is_completion_floor_after_implementation_starts
  - pr_creation_is_checkpoint_not_completion
  - latest_pr_head_is_the_only_merge_ready_evidence_target
  - one_session_one_current_task_by_default
  - one_task_one_delivery_pr_by_default

always_on_skills:
  - skills/prompt-injection-guard/SKILL.md
  - skills/service-ops-safety/SKILL.md

session_contract:
  default_max_current_tasks: 1
  default_max_delivery_prs_per_task: 1
  new_task_requires_task_transition: true
  parallel_task_ownership_requires_explicit_user_authorization: true

specification_confidence:
  levels:
    c2_confirmed:
      implementation_allowed: true
      definition: goal_expected_behavior_and_acceptance_criteria_are_clear_and_material_sources_do_not_conflict
    c1_reconstructed:
      implementation_allowed: true
      definition: missing_detail_is_reconstructed_from_authoritative_evidence_without_material_product_choice
    c0_unclear:
      implementation_allowed: false
      action: requirements_discovery
    c0_conflicted:
      implementation_allowed: false
      action: source_reconciliation_or_human_gate
  evidence_order:
    - current_user_instruction
    - latest_explicitly_approved_spec_or_decision
    - current_task_issue_and_comments
    - canonical_docs
    - tests
    - current_implementation_and_existing_patterns
  conflict_rules:
    expected_delta_is_not_conflict: issue_explicitly_states_current_to_target_change
    unresolved_material_conflict: human_gate
    stale_source_may_be_selected_only_with_evidence: true

risk_model:
  axes:
    blast_radius:
      local: 0
      several_surfaces: 1
      shared_or_system_wide: 2
    data_security:
      none: 0
      indirect: 1
      direct_boundary_change: 2
    reversibility:
      easy: 0
      procedural_rollback: 1
      difficult_or_stateful: 2
    uncertainty:
      known_pattern: 0
      some_unknowns: 1
      novel_or_impact_unclear: 2
  score_mapping:
    r1_low: 0-2
    r2_medium: 3-4
    r3_high: 5-8
  r0_trivial:
    score_based: false
    examples:
      - typo
      - pure_documentation
      - formatting
      - behavior_preserving_micro_change
  r3_floor_triggers:
    - authentication
    - authorization
    - tenant_or_group_boundary
    - schema_or_migration
    - data_deletion_or_retention
    - billing_or_payment_logic
    - privileged_secret_or_env
    - webhook_or_external_service_write
    - production_behavior_configuration
  r4_critical_triggers:
    - production_database_migration
    - bulk_or_irreversible_data_mutation
    - account_deletion_semantics
    - authorization_model_overhaul
    - financial_settlement_integrity
    - production_secret_rotation
    - production_dns_or_domain_cutover
  process_policy:
    default_floor: r2_medium
    r3_when:
      - safety_boundary_changes
      - delivery_completion_contract_changes
      - production_or_destructive_policy_changes
  lifecycle:
    initial: provisional
    confirm_after_requirements_and_impact: true
    escalate_immediately_on_new_evidence: true
    downgrade_only_before_implementation_with_evidence: true
    completion_floor_after_implementation: max_observed_risk

profiles:
  r0_trivial:
    name: trivial
    requirements:
      mode: minimal_plan
      independent_reviews: 0
      post_synthesis_review: 0
    impact_analysis:
      separate_gate: false
    verification:
      mode: targeted
    code_review:
      separate_gate: false
    security_review:
      separate_gate: false
    process_learning:
      mode: event_driven
    loop:
      - workspace_preflight
      - requirements
      - implementation
      - verification
      - delivery
      - pr_aftercare
      - process_learning
      - task_transition

  r1_low:
    name: fast
    default_for_ordinary_local_changes: true
    requirements:
      mode: plan_with_impact_summary
      independent_reviews: 0
      post_synthesis_review: 0
    impact_analysis:
      separate_gate: false
    verification:
      mode: targeted
    code_review:
      mode: combined_code_and_security_quick_scan
    security_review:
      separate_gate: false
    process_learning:
      mode: event_driven
    loop:
      - workspace_preflight
      - requirements
      - implementation
      - verification
      - code_review
      - delivery
      - pr_aftercare
      - process_learning
      - task_transition

  r2_medium:
    name: standard
    requirements:
      mode: standard
      independent_reviews_default: 0
      independent_reviews_when:
        - spec_confidence_is_c1
        - residual_uncertainty_is_material
        - change_is_cross_cutting
        - main_detects_material_ambiguity
      independent_reviews_when_triggered: 1
      post_synthesis_review: 0
    impact_analysis:
      separate_gate: true
    verification:
      mode: scoped_full
    code_review:
      mode: code_review_with_security_quick_scan
    security_review:
      separate_gate: false_unless_r3_floor_trigger
    process_learning:
      mode: event_driven
    loop:
      - workspace_preflight
      - requirements
      - impact_analysis
      - implementation
      - verification
      - code_review
      - security_review
      - delivery
      - pr_aftercare
      - process_learning
      - task_transition

  r3_high:
    name: high
    requirements:
      independent_reviews: 2
      post_synthesis_review: 0
    impact_analysis:
      separate_gate: true
    verification:
      mode: full_for_affected_scope
    code_review:
      separate_gate: true
    security_review:
      separate_gate: true
    process_learning:
      mode: full
    loop:
      - workspace_preflight
      - requirements
      - impact_analysis
      - implementation
      - verification
      - code_review
      - security_review
      - delivery
      - pr_aftercare
      - process_learning
      - task_transition

  r4_critical:
    name: critical
    requirements:
      independent_reviews: 3
      post_synthesis_review: 1
    impact_analysis:
      separate_gate: true
    verification:
      mode: full_plus_recovery_evidence
    code_review:
      separate_gate: true
    security_review:
      separate_gate: true
    human_gates:
      - before_implementation
      - before_production_or_irreversible_operation
    process_learning:
      mode: full
    loop:
      - workspace_preflight
      - requirements
      - human_gate
      - impact_analysis
      - implementation
      - verification
      - code_review
      - security_review
      - delivery
      - pr_aftercare
      - process_learning
      - task_transition

learning_events:
  - human_correction
  - gate_failure
  - ci_or_e2e_failure
  - actionable_review_finding
  - repeated_retry
  - incident
  - scope_or_impact_miss
  - delivery_or_aftercare_miss
  - task_transition_miss

states:
  workspace_preflight:
    skill: skills/workspace-preflight/SKILL.md
    always_required_for_repository_change: true
    explicit_documentation_exception_allowed: true

  requirements:
    skill: skills/requirements/SKILL.md
    owns:
      - spec_confidence
      - source_reconciliation
      - acceptance_criteria
      - initial_risk
      - profile_selection
      - r0_r1_impact_summary
    blocked_when:
      - spec_confidence_is_c0
      - unresolved_material_spec_conflict

  impact_analysis:
    skill: skills/impact-analysis/SKILL.md
    required_for:
      - r2_medium
      - r3_high
      - r4_critical
    may_escalate_risk: true

  implementation:
    skill: skills/implementation/SKILL.md
    entry_requires:
      - spec_confidence_c1_or_c2
      - risk_profile_recorded

  verification:
    skill: skills/verification/SKILL.md
    profile_driven: true

  code_review:
    skill: skills/code-review/SKILL.md
    required_for:
      - r1_low
      - r2_medium
      - r3_high
      - r4_critical
    r1_r2_include_security_quick_scan: true

  security_review:
    skill: skills/security-review/SKILL.md
    required_for:
      - r3_high
      - r4_critical
    r2_required_when_r3_floor_trigger_discovered: true
    otherwise_not_required_with_reason: true

  delivery:
    skill: skills/delivery/SKILL.md
    publish_checkpoint: pr_created
    default_target: merge_ready

  pr_aftercare:
    skill: skills/pr-aftercare/SKILL.md
    observation_unit: latest_head_sha
    pending_is_terminal: false
    head_change_invalidates_prior_observation: true

  process_learning:
    skill: skills/process-learning/SKILL.md
    r0_r2_without_event: fast_none_path
    r0_r2_with_event: full
    r3_r4: full

  task_transition:
    skill: skills/task-transition/SKILL.md
    reasoning_heavy: false
    purpose: close_task_identity_and_release_or_rebind_session

  incident:
    skill: skills/incident/SKILL.md
    trigger_when:
      - root_cause_unknown
      - same_failure_repeated
      - required_gate_cannot_progress

  human_gate:
    terminal: false
    resume: dynamic

  done:
    terminal: true

delivery_contract:
  default_target: merge_ready
  target_values:
    - merge_ready
    - merged_cleaned
  explicit_stop_after_publish:
    allowed: true
    must_be_explicit: true

pr_aftercare_gate:
  pass_when_merge_ready:
    - latest_head_observed
    - required_checks_success_on_latest_head
    - actionable_review_findings_closed_or_rejected_with_reason
    - requested_changes_closed
    - required_approvals_satisfied
    - conflict_free
    - mergeable
    - verified_head_is_current
  forbidden_shortcuts:
    - pending_as_success
    - old_head_success_reuse
    - create_second_delivery_pr
    - switch_task_before_terminal

completion:
  done_requires:
    - spec_confidence_c1_or_c2
    - risk_level_recorded
    - selected_profile_recorded
    - all_profile_required_gates_pass_or_not_required_with_reason
    - delivery_target_reached
    - required_pr_aftercare_terminal
    - learning_event_classified
    - task_transition_complete
    - no_required_blocker
