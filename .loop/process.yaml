version: 5
name: suzumemo-agent-loop
plugin_manifest: plugin.json
skills_root: skills
default_base_branch: preview
entrypoint: AGENTS.md
entry_state: workspace_preflight

always_on_skills:
  - skills/prompt-injection-guard/SKILL.md
  - skills/service-ops-safety/SKILL.md

principles:
  - agent_plugins_v1_layout
  - always_on_safety_skills_apply_to_every_task
  - evidence_before_progress
  - failed_or_blocked_gate_does_not_advance
  - test_added_is_not_test_executed
  - impact_analysis_before_edit
  - code_review_and_security_review_are_independent_gates
  - delivery_state_is_part_of_completion
  - learning_is_part_of_completion
  - prefer_enforcement_over_reminders
  - independent_requirement_review_before_implementation

states:
  - id: workspace_preflight
    skill: skills/workspace-preflight/SKILL.md
    purpose: Verify the task starts in an isolated registered worktree on a non-protected branch with a clean baseline before any repository edit.
    gate: workspace_preflight_gate
    pass: requirements
    blocked: workspace_preflight

  - id: requirements
    skill: skills/requirements/SKILL.md
    purpose: Converge independent requirement reviews with the user request, issue, docs, existing code and tests into testable requirements and acceptance criteria.
    gate: requirements_gate
    pass: impact_analysis
    blocked: blocked

  - id: impact_analysis
    skill: skills/impact-analysis/SKILL.md
    purpose: Identify direct and indirect change impact before editing.
    gate: impact_gate
    pass: implementation
    blocked: impact_analysis

  - id: implementation
    skill: skills/implementation/SKILL.md
    purpose: Implement the minimum scoped change, using RED/GREEN where behavior changes.
    gate: implementation_gate
    pass: verification
    fail: incident

  - id: verification
    skill: skills/verification/SKILL.md
    purpose: Execute required static checks, tests, coverage, E2E, build and runtime/browser verification with evidence.
    gate: verification_gate
    pass: code_review
    fail: incident
    blocked: incident

  - id: code_review
    skill: skills/code-review/SKILL.md
    purpose: Independently review correctness, regression, maintainability and test adequacy.
    gate: code_review_gate
    pass: security_review
    fail: implementation

  - id: security_review
    skill: skills/security-review/SKILL.md
    purpose: Independently review authentication, authorization, data boundaries, inputs, secrets and external-service risk.
    gate: security_review_gate
    pass: delivery
    fail: implementation
    blocked: incident

  - id: incident
    skill: skills/incident/SKILL.md
    purpose: Stop progression, establish facts, identify root cause or blocker, fix and restart from the required state.
    gate: incident_gate
    restart: dynamic

  - id: blocked
    purpose: Non-terminal state for an external dependency or human-only action that prevents a required gate from progressing.
    terminal: false
    resume: dynamic
    done_allowed: false

  - id: delivery
    skill: skills/delivery/SKILL.md
    purpose: Manage commit, push, PR, CI, review aftercare, merge-ready, optional merge and cleanup.
    gate: delivery_gate
    pass: process_learning
    fail_routes:
      code_change_required: implementation
      unknown_or_operational_failure: incident
      specification_conflict: requirements
      approval_required: blocked

  - id: process_learning
    skill: skills/process-learning/SKILL.md
    purpose: Extract reusable process learning and classify the strongest appropriate enforcement target.
    gate: learning_gate
    pass: done

  - id: done
    purpose: Terminal state. All required gates for the requested delivery scope have evidence-backed PASS results.

requirements_protocol:
  required_for:
    - behavior_change
    - ui_change
    - api_or_schema_change
    - auth_or_data_policy_change
    - process_policy_change
  not_required_for:
    - read_only_investigation
    - pure_documentation_change
    - pure_format_or_typo_change
    - behavior_preserving_refactor
  classification_precedence:
    - process_policy_change_overrides_pure_documentation_exemption
    - high_risk_trigger_overrides_normal_classification
    - exempt_is_allowed_only_when_no_required_for_condition_applies
  risk_levels:
    normal:
      required_independent_reviews: 2
      applies_to: behavior_or_ui_changes_without_high_risk_triggers
    high:
      required_independent_reviews: 3
      triggers:
        - authentication
        - authorization
        - api_boundary
        - schema
        - data_retention_or_deletion
        - external_service
        - process_policy
        - production_or_irreversible_operation
  independent_review_contract:
    - all_reviewers_receive_the_same_input_snapshot_and_repository_revision
    - all_reviewers_reference_the_same_immutable_snapshot_id_or_digest
    - snapshot_identity_includes_repository_revision_sources_manifest_and_digest
    - reviewers_are_parallel_and_read_only
    - main_draft_and_other_review_outputs_are_hidden_until_each_review_is_submitted
    - main_is_the_synthesizer_and_is_not_counted_in_the_review_quorum
    - each_review_has_agent_id_perspective_status_input_snapshot_and_evidence
    - each_review_attests_independence_and_records_rerun_lineage_when_invalidated
  synthesis_contract:
    - main_records_agreements_conflicts_resolutions_and_open_blockers
    - material_product_data_auth_or_irreversible_disagreements_are_not_resolved_by_majority_vote
    - changing_the_requirements_packet_invalidates_affected_reviews_and_bumps_packet_version
  post_synthesis_review:
    required: true
    must_check_acceptance_criteria_edge_error_states_scope_and_testability: true
    not_required_only_when: risk_is_exempt_and_reason_is_recorded
    evidence_requires_revision_packet_independence_and_rerun_lineage: true
  disagreement_handling:
    material_disagreement: human_gate
    unresolved_before_decision: blocked
    resume_after_decision: requirements
  unavailable:
    recovery: retry_once_or_use_an_alternate_read_only_agent
    if_quorum_unmet: blocked

verification_delivery_boundary:
  candidate_branch_preview_push:
    purpose: Run preview or E2E verification before code review when the workflow requires it.
    counts_as_delivery: false
    does_not_satisfy:
      - intended_changes_committed
      - intended_branch_pushed
      - pull_request_exists
  delivery_push:
    purpose: Publish the reviewed head and begin Delivery after Security Review.
    counts_as_delivery: true

gates:
  workspace_preflight_gate:
    evidence_required: true
    pass_when:
      - preflight_script_passed
      - current_task_worktree_is_isolated_and_registered
      - current_branch_is_not_protected_base
      - clean_baseline_confirmed
    human_gate_when:
      - explicit_documentation_only_exception_recorded
    forbidden_shortcuts:
      - edit_before_workspace_preflight_pass

  requirements_gate:
    evidence_required: true
    pass_when:
      - goal_and_expected_behavior_defined
      - in_scope_and_out_of_scope_defined
      - acceptance_criteria_are_testable
      - material_edge_and_error_states_considered
      - test_strategy_defined
      - material_ambiguities_resolved_or_human_decision_recorded
      - requirements_risk_classified
      - independent_requirement_review_quorum_met_or_not_required_recorded
      - independent_requirement_reviews_approved_or_resolved
      - independent_requirement_review_evidence_complete
      - requirements_input_snapshot_identity_complete
      - requirements_synthesis_recorded
      - post_synthesis_spec_review_passed_or_exempt_recorded
      - post_synthesis_spec_review_evidence_complete
      - review_packet_matches_input_snapshot
    human_gate_when:
      - multiple_valid_product_choices_materially_change_outcome
      - auth_or_data_policy_requires_product_decision
      - destructive_or_irreversible_choice
      - material_scope_cost_or_billing_choice
      - material_disagreement_requires_user_or_owner_decision
    blocked_when:
      - required_independent_review_unavailable_after_recovery
      - required_review_quorum_not_met
      - material_disagreement_unresolved
      - review_packet_stale_after_requirements_change

  impact_gate:
    evidence_required: true
    pass_when:
      - direct_change_surfaces_identified
      - relevant_callers_and_callees_checked
      - shared_state_checked
      - auth_and_authorization_boundaries_checked_when_relevant
      - data_or_schema_impact_checked_when_relevant
      - affected_ui_or_flows_checked_when_relevant
      - regression_tests_identified
      - external_or_deployment_impact_checked_when_relevant

  implementation_gate:
    evidence_required: true
    pass_when:
      - implementation_matches_requirements
      - implementation_stays_within_scope
      - red_green_evidence_exists_when_behavior_changed
      - no_unexplained_scope_or_design_deviation
      - tracked_and_untracked_diff_integrity_checked
      - workspace_preflight_gate_pass

  verification_gate:
    evidence_required: true
    pass_when:
      - required_static_checks_executed_and_pass
      - required_tests_executed_and_pass
      - test_cases_cover_required_normal_edge_partial_failure_and_failure_paths
      - coverage_checked_when_required
      - e2e_executed_and_pass_when_required
      - required_environment_sync_passed
      - convex_dev_reflection_passed_when_required
      - build_passed_when_required
      - browser_or_runtime_check_passed_when_required
      - skipped_checks_are_explicitly_not_required_with_reason
    forbidden_shortcuts:
      - treat_test_added_as_test_passed
      - treat_expected_success_as_evidence
      - skip_required_e2e_due_to_environment_failure
      - continue_after_required_environment_sync_failed
      - delegate_required_local_verification_to_future_ci
      - count_candidate_branch_preview_push_as_delivery_evidence

  code_review_gate:
    evidence_required: true
    pass_when:
      - acceptance_criteria_match_reviewed
      - no_unresolved_must_fix_findings
      - regression_risk_reviewed
      - maintainability_reviewed
      - frontend_or_backend_specific_checks_applied_when_relevant
      - test_adequacy_reviewed
      - final_diff_integrity_checked
    fail_restart_sequence:
      - implementation
      - verification
      - code_review

  security_review_gate:
    evidence_required: true
    pass_when:
      - authentication_reviewed_when_relevant
      - authorization_reviewed_when_relevant
      - data_boundary_and_privacy_reviewed_when_relevant
      - input_and_injection_reviewed_when_relevant
      - secret_handling_reviewed_when_relevant
      - external_service_risk_reviewed_when_relevant
      - destructive_operations_reviewed_when_relevant
      - no_unresolved_security_must_fix_findings
    allow_not_required_when:
      - no_executable_configuration_or_operational_behavior_changed
    fail_restart_sequence:
      - implementation
      - verification
      - code_review
      - security_review

  incident_gate:
    evidence_required: true
    pass_when:
      - observed_failure_recorded
      - facts_and_unknowns_separated
      - root_cause_or_explicit_blocker_recorded
      - affected_scope_recorded
      - regression_evidence_defined
      - restart_state_defined
    blocked_is_not_done: true

  delivery_gate:
    evidence_required: true
    target_values:
      - pr_created
      - merge_ready
      - merged_cleaned
    default_target: merge_ready
    pass_when_common:
      - intended_changes_committed
      - intended_branch_pushed
      - pull_request_exists
      - pull_request_metadata_verified
    pass_when_merge_ready:
      - pull_request_is_not_draft_unless_explicitly_required
      - required_ci_passed
      - no_unresolved_blocking_review_threads
      - required_approvals_satisfied
      - no_merge_conflict
      - verified_head_is_current
    pass_when_merged_cleaned:
      - pull_request_merged
      - merge_result_verified
      - issue_state_checked
      - task_branch_cleanup_checked
      - task_worktree_cleanup_checked
      - canonical_preview_or_env_source_not_removed
    forbidden_shortcuts:
      - mark_done_after_push_only
      - mark_done_after_single_ci_run_only
      - assume_pull_request_exists
      - fix_review_or_ci_code_in_delivery_without_reverification
      - delete_unmerged_or_uncommitted_task_work

  learning_gate:
    evidence_required: true
    pass_when:
      - human_corrections_reviewed
      - failures_and_retries_reviewed
      - impact_and_delivery_misses_reviewed
      - candidates_recorded_or_explicitly_none
      - duplicate_check_and_target_selection_done_for_each_candidate

incident_loop:
  trigger_when:
    - required_gate_failed_or_blocked
    - same_failure_repeated_twice
    - same_review_finding_recurred_twice
    - ci_or_e2e_root_cause_unknown
  steps:
    - collect_facts_and_exact_evidence
    - classify_failure_domain
    - compare_with_base_or_last_known_good_when_possible
    - create_independent_hypotheses
    - run_smallest_discriminating_check
    - identify_root_cause_or_explicit_blocker
    - reassess_affected_scope
    - apply_fix
    - restart_from_required_state
  blocked_is_not_done: true

learning:
  skill: skills/process-learning/SKILL.md
  event_types:
    - human_correction
    - missing_evidence
    - repeated_retry
    - escaped_defect
    - ci_or_e2e_failure
    - impact_miss
    - delivery_step_miss
    - manual_check_repetition
  candidate_required_fields:
    - trigger
    - observed_problem
    - evidence
    - root_cause
    - generalized_rule
    - recurrence_risk
    - impact
    - deterministic
    - duplicate_status
    - proposed_target
    - target_reason
  target_priority:
    - script_or_code
    - ci_or_gate
    - skill
    - agents_policy
    - runbook
    - task_context
  human_gate_required_for_promotion: true
  lifecycle:
    - candidate
    - accepted_or_rejected
    - applied
    - observing
    - effective_or_recurred
  escalation_on_recurrence:
    - task_context_or_runbook_to_skill
    - skill_to_script_or_ci_gate

completion:
  done_requires:
    - agent_plugins_manifest_present
    - always_on_safety_skills_applied
    - workspace_preflight_gate_pass_or_explicit_exception
    - requirements_gate_pass
    - requirements_convergence_gate_pass_or_not_required
    - impact_gate_pass
    - implementation_gate_pass
    - verification_gate_pass
    - code_review_gate_pass
    - security_review_gate_pass_or_not_required
    - delivery_gate_pass_for_requested_target
    - learning_gate_pass
    - no_required_blocked_items
    - evidence_recorded
