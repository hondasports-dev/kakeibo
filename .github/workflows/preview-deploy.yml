name: Preview Branch Deploy

on:
  push:
    branches: [preview]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Repository ref to deploy to the fixed staging Convex deployment"
        required: true
        default: "preview"

permissions:
  contents: read

concurrency:
  group: preview-branch-deploy
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy preview branch
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
    steps:
      - name: Validate Preview configuration
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("secrets.VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("vars.VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("vars.VERCEL_PROJECT_ID")
          [ -n "$CONVEX_DEPLOY_KEY" ] || missing+=("secrets.CONVEX_DEPLOY_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required Preview configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test --run

      - name: Build Convex staging and Vercel output
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --message "preview branch deploy ${GITHUB_SHA}" \
            --cmd 'pnpm exec vercel build --yes --target=preview --token "$VERCEL_TOKEN"'

      - name: Deploy Vercel Preview
        id: vercel
        run: |
          deployment_url="$(pnpm exec vercel deploy --prebuilt --archive=tgz --target=preview --token "$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run smoke E2E tests
        run: pnpm run e2e:smoke --project=chromium
        env:
          E2E_BASE_URL: ${{ steps.vercel.outputs.url }}
          PLAYWRIGHT_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          VITE_CONVEX_SITE_URL: ${{ vars.VITE_CONVEX_SITE_URL }}
          E2E_CLEANUP_SECRET: ${{ secrets.E2E_CLEANUP_SECRET }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}

      - name: Write summary
        run: |
          {
            echo "## Preview branch deploy"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source ref | \`$SOURCE_REF\` |"
            echo "| Convex deployment | \`staging\` |"
            echo "| Vercel Preview URL | ${{ steps.vercel.outputs.url }} |"
            echo
            echo "This deployment uses the fixed Convex staging deployment and Clerk Development instance."
          } >> "$GITHUB_STEP_SUMMARY"
