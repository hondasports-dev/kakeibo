name: E2E

# Vercel Git Integration が Preview デプロイを完了した時点で、CI 内の Vite dev server に対して実行する。
# deployment_status イベントを使うことで:
#   1. Vercel が発行するデプロイ完了通知を受け取る
#   2. deployment の commit / branch を信頼判定に使う
#   3. Secrets が GitHub から安全に渡される（pull_request イベントの fork 問題を回避）
# Preview URL 自体は E2E 対象にしない。Vercel 対象 E2E は main の release candidate だけで実行する。
#
# 必要な GitHub Actions Secrets（手動設定が必要）:
#   CLERK_PUBLISHABLE_KEY            — Clerk Dev instance の pk_test_...
#   CLERK_SECRET_KEY                 — Clerk Dev instance の sk_test_...
#   E2E_CLERK_USER_EMAIL             — テストユーザーのメールアドレス
#   E2E_CLERK_USER_PASSWORD          — テストユーザーのパスワード
#   DEV_VITE_CONVEX_SITE_URL         — Dev deployment の Convex HTTP URL
#   VITE_CONVEX_URL                  — Dev deployment の Convex WebSocket URL
#   DEV_E2E_CLEANUP_SECRET           — Dev deployment の E2E cleanup 認証シークレット
#   DEV_CONVEX_DEPLOY_KEY            — Dev deployment の deploy key（CI で E2E_CLEANUP_SECRET を同期）
#   E2E_CLERK_USER_ID                — テストユーザーの Clerk tokenIdentifier
#
# 詳細: docs/development-process.md「E2E 確認方針」
#       docs/environment-variables.md「GitHub Actions Secrets に保存する項目」
on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    name: E2E (Playwright / Chromium / ${{ matrix.name }})
    # Vercel の Preview デプロイが成功した時のみ実行
    # Production デプロイ（environment == 'Production'）は除外する
    # GitHub Environment の deployment_status は target_url が Actions job URL になるため除外する
    # preview ブランチのデプロイは preview-deploy.yml 内で smoke E2E を実行するため、
    # Vercel の deployment_status 由来の単独 E2E は重複実行しない
    if: |
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment, 'Preview') &&
      contains(github.event.deployment_status.target_url, '.vercel.app') &&
      github.event.deployment.ref != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    concurrency:
      group: e2e-local-smoke-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: public
            e2e_command: pnpm run e2e:public -- --project=chromium --workers=3
            timeout: 10
          - name: authenticated
            e2e_command: pnpm run e2e:smoke -- --project=chromium --grep-invert @public --workers=1
            timeout: 20
    steps:
      - name: Verify trusted deployment source
        id: trust
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deployment = context.payload.deployment
            const { owner, repo } = context.repo
            const sameRepo = `${owner}/${repo}`
            const ref = deployment?.ref
            const shaFromDeployment = deployment?.sha
            const looksLikeSha = typeof ref === 'string' && /^[0-9a-f]{40}$/i.test(ref)

            let commitSha = shaFromDeployment || (looksLikeSha ? ref : undefined)
            let sameRepoBranch = false
            let reason = 'deployment source could not be verified'
            let docsOnly = false

            if (ref && !looksLikeSha) {
              try {
                const branch = await github.rest.repos.getBranch({ owner, repo, branch: ref })
                const branchSha = branch.data.commit.sha
                if (!shaFromDeployment || branchSha === shaFromDeployment) {
                  commitSha = commitSha || branchSha
                  sameRepoBranch = true
                  reason = `same-repository branch ${ref}`
                } else {
                  reason = `branch ${ref} points to ${branchSha}, not deployment ${shaFromDeployment}`
                }
              } catch (error) {
                core.info(`Deployment ref is not a same-repository branch: ${ref}`)
              }
            }

            let trusted = false
            if (commitSha) {
              // Vercel の deployment_status は、GitHub が commit から PR を即座に
              // 逆引きできる前に届くことがある。
              // その場合でも、同一リポジトリの branch tip が deployment の SHA と
              // 一致していれば、同一ブランチ由来の Preview とみなして E2E を走らせる。
              let prs = { data: [] }
              try {
                prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: commitSha,
                })
              } catch (error) {
                const status = error?.status ?? 'unknown'
                core.warning(
                  `Could not resolve pull requests for commit ${commitSha} (HTTP ${status}); falling back to branch-tip verification.`,
                )
              }
              const sameRepoPr = prs.data.find((pr) => pr.head.repo?.full_name === sameRepo)
              const forkPr = prs.data.find((pr) => pr.head.repo?.full_name !== sameRepo)

              if (sameRepoPr) {
                trusted = true
                reason = `same-repository PR #${sameRepoPr.number}`

                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: sameRepoPr.number,
                  per_page: 100,
                })
                docsOnly =
                  files.length > 0 &&
                  files.every((file) => file.filename.toLowerCase().endsWith('.md'))
                if (docsOnly) {
                  trusted = false
                  reason = `docs-only PR #${sameRepoPr.number}`
                }
              } else if (forkPr) {
                reason = `fork PR #${forkPr.number} from ${forkPr.head.repo?.full_name}`
              } else {
                // commit -> PR の逆引きがまだ取れない場合の保険。
                // branch tip が一致するなら、その branch からの Preview と判断する。
                const branches = await github.paginate(github.rest.repos.listBranches, {
                  owner,
                  repo,
                  per_page: 100,
                })
                const sameRepoBranchTip = branches.find((branch) => branch.commit?.sha === commitSha)

                if (sameRepoBranchTip) {
                  trusted = true
                  reason = `same-repository branch ${sameRepoBranchTip.name}`
                } else if (sameRepoBranch) {
                  trusted = true
                }
              }
            }

            core.setOutput('trusted', trusted ? 'true' : 'false')
            core.setOutput('docs_only', docsOnly ? 'true' : 'false')
            core.setOutput('checkout_ref', commitSha || ref)
            core.setOutput('reason', reason)

            if (trusted) {
              core.info(`Trusted deployment source: ${reason}`)
            } else if (docsOnly) {
              core.notice(`Skipping E2E for Markdown-only changes: ${reason}`)
            } else {
              core.notice(`Skipping secrets-backed E2E: ${reason}`)
            }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.trust.outputs.trusted == 'true'
        with:
          persist-credentials: false
          # trust判定で検証したcommitをcheckoutし、Preview URLとE2Eコードのずれを避ける
          ref: ${{ steps.trust.outputs.checkout_ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.trust.outputs.trusted == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.trust.outputs.trusted == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        if: steps.trust.outputs.trusted == 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.trust.outputs.trusted == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          # @playwright/test のバージョンが変わったときのみ再ダウンロード
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.trust.outputs.trusted == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright system dependencies (cache hit時)
        if: steps.trust.outputs.trusted == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Sync E2E cleanup secret to dev deployment
        if: steps.trust.outputs.trusted == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.DEV_CONVEX_DEPLOY_KEY }}
          E2E_CLEANUP_SECRET: ${{ secrets.DEV_E2E_CLEANUP_SECRET }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
        run: |
          if [ -z "$E2E_CLEANUP_SECRET" ]; then
            echo "::error::DEV_E2E_CLEANUP_SECRET is not set."
            exit 1
          fi
          if [ -z "$E2E_CLERK_USER_ID" ]; then
            echo "::error::E2E_CLERK_USER_ID is not set."
            exit 1
          fi
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::warning::DEV_CONVEX_DEPLOY_KEY is not set. Skipping Convex env sync."
            echo "Ensure Convex dev APP_ENV=development, E2E_CLERK_USER_ID, and E2E_CLEANUP_SECRET already match the CI secrets."
            exit 0
          fi
          pnpm exec convex env set APP_ENV development
          pnpm exec convex env set RECEIPT_IMAGE_EXTRACTOR_MODE mock
          pnpm exec convex env set E2E_CLERK_USER_ID "$E2E_CLERK_USER_ID"
          pnpm exec convex env set E2E_CLEANUP_SECRET "$E2E_CLEANUP_SECRET"

      - name: Configure local Vite E2E
        if: steps.trust.outputs.trusted == 'true'
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [[ ! "$VITE_CONVEX_URL" =~ ^https://[a-z0-9-]+\.convex\.cloud/?$ ]]; then
            echo "::error::VITE_CONVEX_URL must be an https://*.convex.cloud URL."
            exit 1
          fi
          VITE_CONVEX_URL="${VITE_CONVEX_URL%/}"
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::CLERK_PUBLISHABLE_KEY is not set."
            exit 1
          fi
          echo "VITE_CONVEX_URL=$VITE_CONVEX_URL" >> "$GITHUB_ENV"
          echo "VITE_CLERK_PUBLISHABLE_KEY=$VITE_CLERK_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Run local smoke E2E tests
        if: steps.trust.outputs.trusted == 'true'
        run: ${{ matrix.e2e_command }}
        env:
          # Clerk Testing Token 取得用
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # E2E テストユーザー認証情報（ログ出力禁止）
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          # CI 内の Vite dev server が接続する Dev deployment の cleanup / seed 設定
          VITE_CONVEX_SITE_URL: ${{ secrets.DEV_VITE_CONVEX_SITE_URL }}
          E2E_CLEANUP_SECRET: ${{ secrets.DEV_E2E_CLEANUP_SECRET }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}

      # 失敗時のみ artifact を保存（認証情報が含まれる可能性があるため短期保存）
      - name: Upload test results on failure
        if: failure() && steps.trust.outputs.trusted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          # 1日で削除（認証情報が含まれる可能性があるため最短期間）
          retention-days: 1
