name: 調査・設計
description: 実装前に調査・比較・設計判断が必要なテーマを整理する
title: ""
body:
  - type: markdown
    attributes:
      value: |
        このIssueでは実装そのものより、判断に必要な事実と選択肢を揃えることを目的にします。

  - type: textarea
    id: question
    attributes:
      label: 調べたいこと・決めたいこと
      description: 最終的に答えを出したい問いを記載してください。
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: なぜ判断が必要か
      description: この判断が後続の実装や運用へどう影響するかを記載してください。
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: 現時点の仮説
      description: いま考えている方向性や予想があれば記載してください。なければ「なし」で構いません。
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: 制約・前提
      description: 技術、セキュリティ、コスト、運用、互換性など、判断時に守る条件を記載してください。
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: 比較する選択肢
      description: 比較対象が分かっている場合は列挙してください。
      placeholder: |
        - 案A: xxx
        - 案B: xxx

  - type: textarea
    id: decision-points
    attributes:
      label: 判断基準
      description: 何を比較して結論を出すかを記載してください。
      placeholder: |
        - セキュリティ
        - 実装コスト
        - 運用負荷
        - 将来の拡張性
    validations:
      required: true

  - type: textarea
    id: exit-criteria
    attributes:
      label: 調査終了条件
      description: どの状態になれば調査を完了し、後続へ進めるかを記載してください。
      placeholder: |
        - [ ] 選択肢の比較結果が整理されている
        - [ ] 採用案と不採用理由が記録されている
        - [ ] 必要な後続Issueが作成できる状態になっている
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連Issue・参考資料
      description: 関連Issue、公式ドキュメント、PoC、既存コードなどがあれば記載してください。
