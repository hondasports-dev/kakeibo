name: 機能追加・改善
description: 新機能や既存機能の改善を提案する
title: ""
body:
  - type: markdown
    attributes:
      value: |
        実装方法（HOW）ではなく、目的（WHY）・実現したいこと（WHAT）・完了条件（DONE）を中心に記載してください。

  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: このIssueで達成したいことを簡潔に記載してください。
      placeholder: 例）履歴から支出・収入を横断して検索できるようにする。
    validations:
      required: true

  - type: textarea
    id: user-value
    attributes:
      label: ユーザー価値
      description: 誰の、どのような不便・課題を解決するかを記載してください。
      placeholder: 例）過去の家計記録を探す際に、支出と収入で別々の導線を使い分けなくてよくなる。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景・現状の問題
      description: 現在の挙動や、なぜ変更が必要なのかを記載してください。
    validations:
      required: true

  - type: textarea
    id: in-scope
    attributes:
      label: やること
      description: このIssueに含める範囲を箇条書きで記載してください。
      placeholder: |
        - xxxを追加する
        - xxxを変更する
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: やらないこと
      description: スコープを広げないため、このIssueでは扱わないことを記載してください。
      placeholder: |
        - xxxは別Issueで扱う
        - xxxの仕様変更は行わない
    validations:
      required: true

  - type: dropdown
    id: spec-certainty
    attributes:
      label: 仕様の確定度
      description: 現時点での仕様の確定状況を選択してください。
      options:
        - 確定
        - 一部未確定
        - 調査が必要
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 完了条件
      description: 何を満たせばこのIssueを完了と判断できるかをチェックリストで記載してください。
      placeholder: |
        - [ ] xxxできる
        - [ ] xxxの場合も既存挙動が壊れない
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 依存関係・関連Issue
      description: 前提となるIssueや関連Issueがあれば記載してください。
      placeholder: "例）#123, #456"

  - type: textarea
    id: qa
    attributes:
      label: QA観点
      description: 特に確認してほしい正常系・異常系・境界条件があれば記載してください。

  - type: textarea
    id: additional-context
    attributes:
      label: 補足
      description: スクリーンショット、参考資料、設計上の制約などがあれば記載してください。
